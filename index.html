<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rate Your Experience</title>
  <style>
    :root {
      --bg-top: #0f172a;
      --bg-bottom: #1e293b;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --star-idle: #e2e8f0;
      --star-active: #fbbf24;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      padding: 20px;
      color: var(--text);
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 390px;
      padding: 34px 26px;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      text-align: center;
      animation: popIn 0.35s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 8px;
      color: var(--text);
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 24px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .star {
      font-size: 44px;
      line-height: 1;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--star-idle);
      padding: 4px;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .star.active,
    .star:hover {
      color: var(--star-active);
      transform: scale(1.16);
      text-shadow: 0 4px 14px rgba(251, 191, 36, 0.45);
    }

    .hidden {
      display: none;
    }

    textarea {
      width: 100%;
      height: 112px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-size: 15px;
      color: var(--text);
      background: #f8fafc;
      margin-bottom: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px rgba(37, 99, 235, 0.6);
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .check-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dcfce7;
      color: var(--success);
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">★ Quick Rating</div>
    <h1>Rate Your Experience</h1>
    <p id="subtitle">Tap a star to share your experience</p>

    <div id="ratingSection">
      <div class="stars" id="starBox">
        <button class="star" data-val="1" aria-label="1 star">★</button>
        <button class="star" data-val="2" aria-label="2 stars">★</button>
        <button class="star" data-val="3" aria-label="3 stars">★</button>
        <button class="star" data-val="4" aria-label="4 stars">★</button>
        <button class="star" data-val="5" aria-label="5 stars">★</button>
      </div>
    </div>

    <div id="writeBox" class="hidden">
      <textarea id="msg" placeholder="Write why you gave this rating..."></textarea>
      <button class="btn" id="submitBtn" onclick="handleSubmit()">Continue</button>
    </div>

    <div id="thanksBox" class="hidden">
      <div class="check-circle">✓</div>
      <h1 style="font-size:20px; margin-bottom:6px;">Thank You!</h1>
      <p style="margin:0;">Your feedback has been sent.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const rawGoogle = (params.get("google") || "").trim();
    const waNumber = (params.get("wa") || "").replace(/\D/g, "");

    const googleUrl = /^https?:\/\//i.test(rawGoogle) ? rawGoogle : "";

    let selectedRating = 0;
    const stars = document.querySelectorAll(".star");
    const writeBox = document.getElementById("writeBox");
    const msgInput = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");
    const subtitle = document.getElementById("subtitle");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = Number(star.dataset.val);
        stars.forEach(s => s.classList.toggle("active", Number(s.dataset.val) <= selectedRating));
        writeBox.classList.remove("hidden");

        if (selectedRating >= 4) {
          subtitle.textContent = "Awesome! What did you enjoy most?";
          msgInput.placeholder = "Write a quick review (copied for Google)...";
          submitBtn.textContent = googleUrl ? "Copy & Post on Google" : "Send Review";
        } else {
          subtitle.textContent = "Sorry about that. How can we do better?";
          msgInput.placeholder = "Send a private note to management...";
          submitBtn.textContent = "Send Private Feedback";
        }
      });
    });

    async function handleSubmit() {
      const note = msgInput.value.trim();
      if (!note) {
        msgInput.focus();
        return;
      }

      if (selectedRating >= 4) {
        if (googleUrl) {
          try { await navigator.clipboard.writeText(note); } catch (e) {}
          window.location.href = googleUrl;
        } else if (waNumber) {
          const text = encodeURIComponent(`Customer review (${selectedRating}/5 stars): ${note}`);
          window.location.href = `https://wa.me/${waNumber}?text=${text}`;
        } else {
          showThanks();
        }
      } else {
        if (waNumber) {
          const text = encodeURIComponent(`Private feedback (${selectedRating}/5 stars): ${note}`);
          window.location.href = `https://wa.me/${waNumber}?text=${text}`;
        } else {
          showThanks();
        }
      }
    }

    function showThanks() {
      document.getElementById("ratingSection").classList.add("hidden");
      writeBox.classList.add("hidden");
      subtitle.classList.add("hidden");
      document.getElementById("thanksBox").classList.remove("hidden");
    }
  </script>
</body>
</html>
