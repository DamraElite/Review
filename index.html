<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rate Your Experience</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --star-idle: #e2e8f0;
      --star-active: #f59e0b;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      padding: 20px;
      color: var(--text);
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 390px;
      padding: 36px 28px;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      animation: fadeUp 0.4s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin: 0 0 8px;
      color: var(--text);
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 28px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .star {
      font-size: 42px;
      line-height: 1;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--star-idle);
      padding: 4px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.15s ease;
    }

    .star.active,
    .star:hover {
      color: var(--star-active);
      transform: scale(1.15);
    }

    .star:active {
      transform: scale(0.95);
    }

    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 14px;
    }

    .hidden {
      display: none;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-size: 15px;
      color: var(--text);
      background: #f8fafc;
      margin-bottom: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .check-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ecfdf5;
      color: var(--success);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .success-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .success-text {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Customer Feedback</div>
    <h1 id="shopName">How was your visit?</h1>
    <p id="subtitle">Tap a star below to share your experience</p>

    <div id="ratingSection">
      <div class="stars" id="starBox">
        <button class="star" data-val="1" aria-label="1 star">★</button>
        <button class="star" data-val="2" aria-label="2 stars">★</button>
        <button class="star" data-val="3" aria-label="3 stars">★</button>
        <button class="star" data-val="4" aria-label="4 stars">★</button>
        <button class="star" data-val="5" aria-label="5 stars">★</button>
      </div>
      <div class="hint">Takes less than 10 seconds</div>
    </div>

    <div id="feedbackBox" class="hidden">
      <textarea id="msg" placeholder="Tell management how we can improve..."></textarea>
      <button class="btn" onclick="sendPrivate()">Send Private Feedback</button>
    </div>

    <div id="thanksBox" class="hidden">
      <div class="check-circle">✓</div>
      <div class="success-title">Thank You!</div>
      <p class="success-text">Your feedback has been shared directly with management.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const shop = params.get("shop") || "Us";
    const googleUrl = params.get("google") || "";
    const waNumber = (params.get("wa") || "").replace(/\D/g, "");

    document.getElementById("shopName").textContent = shop;

    let selectedRating = 0;
    const stars = document.querySelectorAll(".star");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = Number(star.dataset.val);
        stars.forEach(s => s.classList.toggle("active", Number(s.dataset.val) <= selectedRating));

        setTimeout(() => {
          if (selectedRating >= 4) {
            if (googleUrl) {
              window.location.href = googleUrl;
            } else if (waNumber) {
              const text = encodeURIComponent(`Hi ${shop}! I just visited and rated my experience ${selectedRating}/5 stars.`);
              window.location.href = `https://wa.me/${waNumber}?text=${text}`;
            } else {
              showThanks();
            }
          } else {
            document.getElementById("ratingSection").classList.add("hidden");
            document.getElementById("subtitle").textContent = "We want to make things right. Send a private message to the manager:";
            document.getElementById("feedbackBox").classList.remove("hidden");
          }
        }, 220);
      });
    });

    function sendPrivate() {
      const note = document.getElementById("msg").value.trim();
      if (!note) return;

      if (waNumber) {
        const text = encodeURIComponent(`Private feedback for ${shop} (${selectedRating}/5 stars): ${note}`);
        window.location.href = `https://wa.me/${waNumber}?text=${text}`;
      } else {
        showThanks();
      }
    }

    function showThanks() {
      document.getElementById("ratingSection").classList.add("hidden");
      document.getElementById("feedbackBox").classList.add("hidden");
      document.getElementById("subtitle").classList.add("hidden");
      document.getElementById("thanksBox").classList.remove("hidden");
    }
  </script>
</body>
</html>
